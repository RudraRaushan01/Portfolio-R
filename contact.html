        rel="stylesheet"> -->

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar container">
            <a href="index.html" class="logo">Ru<span class="highlight">dra.</span></a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" class="active btn btn-sm">Contact Me</a></li>
            </ul>

            <div class="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>
        </nav>
    </header>

    <main>
        <!-- Contact Section -->
        <section id="contact" class="section contact">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">Contact <span class="highlight">Me</span></h2>
                    <p class="section-subtitle">Let's work together</p>
                </div>

                <div class="contact-wrapper">
                    <div class="contact-info">
                        <div class="contact-item">
                            <div class="icon"><i class="fa-solid fa-envelope"></i></div>
                            <div>
                                <h4>Email</h4>
                                <p>rudraraushan000@gmail.com</p>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="icon"><i class="fa-solid fa-location-dot"></i></div>
                            <div>
                                <h4>Location</h4>
                                <p>Noida, Uttar Pradesh, India</p>
                            </div>
                        </div>
                    </div>

                    <form class="contact-form">
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <textarea placeholder="Your Message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
